version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rencanangoding_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rencanangoding
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rencanangoding_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/rencanangoding
      - NODE_ENV=production
      - AI_PROVIDER=mock
    depends_on:
      - postgres

volumes:
  pgdata:
