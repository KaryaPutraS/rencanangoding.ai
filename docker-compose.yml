version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rencanangoding_web
    restart: always
    ports:
      - "7518:7518"
    environment:
      - PORT=7518
      - NODE_ENV=production
      - AI_PROVIDER=mock
    volumes:
      - rencanangoding_data:/root/.rencanangoding

volumes:
  rencanangoding_data:
